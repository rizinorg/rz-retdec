name: CI

on:
  push:
    branches:
      - dev
      - stable
      - 'test-*'

  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build qt6-base-dev qtchooser qmake6 qt6-base-dev-tools qt6-svg-dev qt6-tools-dev qt6-5compat-dev
          echo "meson==0.61.1 --hash=sha256:81113785106d485e38d85b92169dca112e6e077880731ac37d29fc9898e1efb5" > requirements.txt
          sudo pip3 install -r requirements.txt # ubuntu meson is too old
      - name: Build and install rizin
        run: |
          git clone https://github.com/rizinorg/rizin
          cd rizin
          meson build --prefix=/usr
          ninja -C build
          sudo ninja -C build install
      - name: Build and install cutter
        run: |
          git clone --recursive https://github.com/rizinorg/cutter
          cd cutter
          cmake -Bbuild -GNinja -DCUTTER_USE_BUNDLED_RIZIN=OFF -DCMAKE_INSTALL_PREFIX=/usr
          ninja -C build
          sudo ninja -C build install
      - name: Build rz-retdec
        run: |
          cmake -Bbuild -DCMAKE_INSTALL_PREFIX=$HOME/.local -DBUILD_CUTTER_PLUGIN=ON
          cd build
          make -j $(nproc)
          make install
      - name: Run tests
        run: make -C test
